<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태어난 달로 먹을 음식 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      color: #543b42;
      background:
        radial-gradient(circle at 10% 10%, #fff9df 0, transparent 30%),
        radial-gradient(circle at 90% 90%, #ffe0e9 0, transparent 32%),
        linear-gradient(135deg, #fff9ed, #fff0f4);
    }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
      padding: 45px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 34px;
    }

    .badge {
      display: inline-block;
      padding: 9px 17px;
      margin-bottom: 15px;
      border-radius: 999px;
      background: #ffd7df;
      color: #9b5364;
      font-size: 15px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      color: #4e353b;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.15;
      letter-spacing: -2px;
    }

    .subtitle {
      margin: 15px auto 0;
      max-width: 620px;
      color: #7d6269;
      font-size: 19px;
      line-height: 1.65;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
      margin-bottom: 25px;
    }

    .month-button {
      border: 2px solid #f3cbd3;
      border-radius: 18px;
      padding: 19px 8px;
      background: rgba(255, 252, 244, 0.96);
      color: #66484f;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .month-button:hover,
    .month-button:focus {
      transform: translateY(-3px);
      background: #ffe8d7;
      border-color: #eab0bc;
      outline: none;
    }

    .hint {
      text-align: center;
      margin-top: 20px;
      color: #9a777f;
      font-size: 15px;
    }

    .result {
      display: none;
      padding: clamp(28px, 6vw, 48px);
      border: 2px solid #f0c7d0;
      border-radius: 30px;
      background: rgba(255, 253, 247, 0.97);
      text-align: center;
      box-shadow: 0 18px 55px rgba(141, 91, 105, 0.13);
      animation: appear 0.35s ease;
    }

    .result.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .month-label {
      display: inline-block;
      padding: 9px 19px;
      margin-bottom: 20px;
      border-radius: 999px;
      background: #ffd6df;
      color: #965264;
      font-size: 17px;
      font-weight: 900;
    }

    .food-emoji {
      margin: 5px 0 18px;
      font-size: clamp(85px, 18vw, 145px);
      line-height: 1;
    }

    .food-name {
      margin: 0;
      color: #4d343a;
      font-size: clamp(34px, 7vw, 54px);
      letter-spacing: -1px;
    }

    .reason {
      max-width: 620px;
      margin: 18px auto 28px;
      color: #725b61;
      font-size: 19px;
      line-height: 1.8;
    }

    .compatibility {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 19px;
      border: 1px solid #f0c9a7;
      border-radius: 16px;
      background: #fff0d6;
      color: #76533c;
      font-size: 17px;
      font-weight: 800;
    }

    .compatible-month {
      color: #b04f69;
      font-weight: 900;
    }

    .reset-button {
      display: block;
      margin: 28px auto 0;
      padding: 15px 27px;
      border: none;
      border-radius: 16px;
      background: #76515c;
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .reset-button:hover,
    .reset-button:focus {
      background: #5c3d46;
      transform: translateY(-2px);
      outline: none;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 30px;
      }

      .month-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .month-button {
        padding: 16px 5px;
        font-size: 17px;
      }

      .subtitle {
        font-size: 17px;
      }
    }

    @media (max-width: 400px) {
      .month-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <div class="badge">🍴 태어난 달에 어울리는 음식은?</div>

      <h1>태어난 달로 먹을 음식 찾기</h1>

      <p class="subtitle">
        내가 태어난 달을 골라보세요.<br>
        오늘 당신에게 어울리는 음식은 무엇일까요?
      </p>
    </header>

    <section
      class="month-grid"
      id="monthGrid"
      aria-label="태어난 달 선택"
    ></section>

    <p class="hint" id="hint">
      태어난 달을 하나 골라주세요!
    </p>

    <section
      class="result"
      id="result"
      aria-live="polite"
    >
      <div class="month-label" id="monthLabel"></div>

      <div class="food-emoji" id="foodEmoji"></div>

      <h2 class="food-name" id="foodName"></h2>

      <p class="reason" id="reason"></p>

      <div class="compatibility">
        💕 잘 맞는 달
        <span class="compatible-month" id="compatibleMonth"></span>
      </div>

      <button
        class="reset-button"
        id="resetButton"
        type="button"
      >
        ↩ 다시 고르기
      </button>
    </section>

  </main>

  <script>
    /*
      태어난 달별 음식 데이터
      외부 파일이나 인터넷을 사용하지 않습니다.
    */

    const foodData = {
      1: {
        food: "떡국",
        emoji: "🍲",
        reason:
          "새로운 시작의 설렘을 품고 있는 1월생에게 따뜻한 떡국이 잘 어울려요.<br>깔끔하고 든든한 한 그릇처럼 차분하게 한 해를 시작하는 느낌이 매력적이에요.",
        compatible: "7월"
      },

      2: {
        food: "초콜릿",
        emoji: "🍫",
        reason:
          "달콤하고 포근한 분위기의 2월생에게 초콜릿이 딱 어울려요.<br>작은 한 조각만으로도 기분을 달콤하게 만들어주는 사랑스러운 음식이에요.",
        compatible: "8월"
      },

      3: {
        food: "딸기 케이크",
        emoji: "🍰",
        reason:
          "봄의 시작처럼 산뜻하고 설레는 3월생에게 딸기 케이크가 잘 맞아요.<br>상큼한 딸기와 부드러운 크림처럼 밝고 사랑스러운 매력이 있어요.",
        compatible: "9월"
      },

      4: {
        food: "김밥",
        emoji: "🍙",
        reason:
          "활기차고 다양한 매력을 가진 4월생에게 알록달록한 김밥이 잘 어울려요.<br>여러 재료가 하나로 어우러지는 것처럼 다양한 사람들과 자연스럽게 어울리는 타입이에요.",
        compatible: "10월"
      },

      5: {
        food: "파스타",
        emoji: "🍝",
        reason:
          "여유로운 봄날의 분위기를 닮은 5월생에게 파스타가 잘 어울려요.<br>취향에 따라 재료와 소스를 골라 자신만의 맛을 만들 수 있는 음식이에요.",
        compatible: "11월"
      },

      6: {
        food: "냉면",
        emoji: "🍜",
        reason:
          "더운 계절을 시원하게 즐기는 6월생에게 깔끔한 냉면이 딱이에요.<br>복잡하지 않으면서도 한 번 맛보면 계속 생각나는 매력이 있어요.",
        compatible: "12월"
      },

      7: {
        food: "치킨",
        emoji: "🍗",
        reason:
          "여름처럼 활기차고 에너지 넘치는 7월생에게 바삭한 치킨이 잘 어울려요.<br>친구들과 함께 먹으며 신나게 웃을 때 가장 빛나는 음식이에요.",
        compatible: "1월"
      },

      8: {
        food: "빙수",
        emoji: "🍧",
        reason:
          "뜨거운 여름의 중심에 태어난 8월생에게 시원하고 달콤한 빙수가 잘 맞아요.<br>다양한 토핑처럼 취향도 다채롭고 즐거움을 찾아가는 매력이 있어요.",
        compatible: "2월"
      },

      9: {
        food: "송편",
        emoji: "🥟",
        reason:
          "가을의 풍요로움과 따뜻한 분위기를 가진 9월생에게 송편이 잘 어울려요.<br>소박하지만 정성이 느껴지고, 사람들과 함께 나눌 때 더욱 맛있는 음식이에요.",
        compatible: "3월"
      },

      10: {
        food: "피자",
        emoji: "🍕",
        reason:
          "활동하기 좋은 계절처럼 자유롭고 즐거운 10월생에게 피자가 딱이에요.<br>토핑을 자유롭게 고르고 여러 사람과 나눠 먹는 재미가 있는 음식이에요.",
        compatible: "4월"
      },

      11: {
        food: "라멘",
        emoji: "🍜",
        reason:
          "쌀쌀해지는 계절의 포근함을 닮은 11월생에게 따뜻한 라멘이 잘 맞아요.<br>진한 국물과 다양한 재료처럼 깊고 풍부한 매력을 가진 음식이에요.",
        compatible: "5월"
      },

      12: {
        food: "붕어빵",
        emoji: "🐟",
        reason:
          "겨울의 포근한 추억을 가진 12월생에게 따뜻한 붕어빵이 잘 어울려요.<br>손에 쥐었을 때의 따뜻함처럼 주변 사람들에게 편안함을 주는 음식이에요.",
        compatible: "6월"
      }
    };

    const months = [
      "1월", "2월", "3월", "4월",
      "5월", "6월", "7월", "8월",
      "9월", "10월", "11월", "12월"
    ];

    const monthGrid = document.getElementById("monthGrid");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    const monthLabel = document.getElementById("monthLabel");
    const foodEmoji = document.getElementById("foodEmoji");
    const foodName = document.getElementById("foodName");
    const reason = document.getElementById("reason");
    const compatibleMonth =
      document.getElementById("compatibleMonth");
    const resetButton =
      document.getElementById("resetButton");

    /*
      12개 달 버튼 만들기
    */
    months.forEach(function(month, index) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "month-button";
      button.textContent = month;

      button.setAttribute(
        "aria-label",
        month + " 선택"
      );

      button.addEventListener("click", function() {
        showResult(index + 1);
      });

      monthGrid.appendChild(button);
    });

    /*
      결과 보여주기
    */
    function showResult(month) {
      const data = foodData[month];

      monthLabel.textContent =
        month + "월생에게 어울리는 음식";

      foodEmoji.textContent =
        data.emoji;

      foodName.textContent =
        data.food;

      reason.innerHTML =
        data.reason;

      compatibleMonth.textContent =
        data.compatible;

      monthGrid.style.display = "none";
      hint.style.display = "none";

      result.classList.add("show");

      window.scrollTo({
        top: result.offsetTop - 20,
        behavior: "smooth"
      });
    }

    /*
      다시 고르기
    */
    function reset() {
      result.classList.remove("show");

      monthGrid.style.display = "grid";
      hint.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    resetButton.addEventListener(
      "click",
      reset
    );
  </script>

</body>
</html>
